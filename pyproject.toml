[project]
name = "prompt-listener"
version = "1.0.2"
description = "Versioned fork-master template: 5-stage prompt/session analysis pipeline plus AgentEvent v2 provenance schema for human-AI interaction research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]

[project.urls]
Repository = "https://github.com/ellmos-ai/prompt-listener"
Documentation = "https://github.com/ellmos-ai/prompt-listener#readme"
"Bug Tracker" = "https://github.com/ellmos-ai/prompt-listener/issues"
Security = "https://github.com/ellmos-ai/prompt-listener/blob/master/SECURITY.md"
"Marketing Log" = "https://github.com/ellmos-ai/prompt-listener/blob/master/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/ellmos-ai/prompt-listener/blob/master/THIRD_PARTY_LICENSES.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
line-length = 120
target-version = "py310"
